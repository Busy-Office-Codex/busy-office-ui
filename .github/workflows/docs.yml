name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'src/**'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs-site depends on the root package (`@busyoffice/design-system: workspace:*`) and its
      # live demos import the real built output — build the root package first.
      - run: pnpm build
      - run: pnpm --filter docs-site build
      - run: pnpm --filter docs-site check-links
      - run: pnpm --filter docs-site check-live-demos
      - run: pnpm --filter docs-site check-llms-txt

      - name: Compute lowercase image name
        id: image
        # ghcr.io image paths must be all-lowercase; the repository owner
        # (Busy-Office-Codex) is not.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-docs" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: docs-site
          file: docs-site/Containerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
